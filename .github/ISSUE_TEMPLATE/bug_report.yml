name: 🐛 Bug Report
description: Reportar un error o problema
title: "[BUG]: "
labels: ["bug", "sprint-1"]
body:
  - type: markdown
    attributes:
      value: |
        ## Reporte de Bug
        Gracias por ayudar a mejorar Kiwisha.
  
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: ¿Qué está fallando?
      placeholder: Describe el error...
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: ¿Cómo podemos replicar el error?
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver error
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería pasar?
      placeholder: Describe el comportamiento correcto...
    validations:
      required: false
  
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: ¿Qué está pasando realmente?
      placeholder: Describe lo que ocurre...
    validations:
      required: false
