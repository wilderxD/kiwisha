<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Catálogo</a></li>
            </ul>
            <ul class="navbar-nav">
                <li th:if="${session.user == null}" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li th:if="${session.user != null}" class="nav-item"><span class="nav-link text-white" th:text="${'Hola, ' + session.user}"></span></li>
                <li th:if="${session.user != null}" class="nav-item"><a class="nav-link text-warning" href="/logout">Salir</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="fw-bold mb-4 border-start border-4 border-primary ps-3">Tu Carrito de Compras</h2>
    
    <div th:if="${cart.empty}" class="text-center py-5 bg-white rounded shadow-sm">
        <h3 class="text-muted">El carrito está vacío</h3>
        <a href="/productos" class="btn btn-primary mt-3">Ir a comprar</a>
    </div>

    <div th:if="${!cart.empty}" class="row g-4">
        <div class="col-md-8">
            <div class="bg-white rounded shadow-sm p-4">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="rounded me-3 bg-light d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; position: relative; overflow: hidden;">
                                        <img th:src="${item.product.imageUrl}" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover;" onerror="this.style.display='none'">
                                        <!-- Fallback por Categoría -->
                                        <span th:if="${item.product.category == 'Granos'}">🌾</span>
                                        <span th:if="${item.product.category == 'Harinas'}">🍞</span>
                                        <span th:if="${item.product.category == 'Snacks'}">🍫</span>
                                        <span th:if="${item.product.category != 'Granos' && item.product.category != 'Harinas' && item.product.category != 'Snacks'}">🥣</span>
                                    </div>
                                    <div>
                                        <div class="fw-bold" th:text="${item.product.name}">Nombre</div>
                                        <small class="text-muted">S/ <span th:text="${item.product.price}"></span></small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <form th:action="@{/carrito/actualizar}" method="post" class="d-flex align-items-center">
                                    <input type="hidden" name="productId" th:value="${item.product.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" class="form-control form-control-sm me-2" style="width: 70px;" min="1" th:max="${item.product.stock}">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">↺</button>
                                </form>
                            </td>
                            <td class="fw-bold text-primary">S/ <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></td>
                            <td>
                                <a th:href="@{/carrito/eliminar/{id}(id=${item.product.id})}" class="btn btn-sm btn-link text-danger">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-md-4">
            <div class="bg-white rounded shadow-sm p-4 sticky-top">
                <h4 class="fw-bold mb-4">Resumen</h4>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span>S/ <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></span>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <span>Envío</span>
                    <span class="text-success">Gratis</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="h5 fw-bold">Total</span>
                    <span class="h5 fw-bold text-primary">S/ <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></span>
                </div>
                <div class="d-grid">
                    <a href="/carrito/checkout" class="btn btn-primary btn-lg py-3 rounded-pill shadow-sm">Continuar compra</a>
                </div>
                <a href="/productos" class="btn btn-link w-100 text-muted mt-3 text-decoration-none">← Seguir comprando</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
