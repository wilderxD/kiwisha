<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>
                    
                    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" placeholder="admin@kiwisha.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="123" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2 rounded-pill">Ingresar</button>
                        </div>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p class="mb-1"><small class="text-muted text-center">¿Olvidaste tu contraseña? <a href="/recuperar" class="text-decoration-none">Recupérala aquí</a></small></p>
                        <small class="text-muted">¿No tienes cuenta? <a href="/registro" class="text-decoration-none">Regístrate gratis</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
