<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Recuperar Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <h3 class="text-center mb-4">Recuperar Contraseña</h3>
                <p class="text-muted text-center">Ingresa tu email y te enviaremos un enlace.</p>
                
                <form action="/recuperar" method="get">
                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" required placeholder="tu@email.com">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Enviar Enlace</button>
                    
                    <div th:if="${msg}" class="alert alert-info mt-3 border-0" th:text="${msg}"></div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/login" class="text-decoration-none">← Volver al Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
