<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Catálogo</a></li>
            </ul>
            <ul class="navbar-nav">
                <li th:if="${session.user == null}" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li th:if="${session.user != null}" class="nav-item"><span class="nav-link text-white" th:text="${'Hola, ' + session.user}"></span></li>
                <li th:if="${session.user != null}" class="nav-item"><a class="nav-link text-warning" href="/logout">Salir</a></li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light ms-lg-3 px-3 rounded-pill" href="/carrito">
                        🛒 <span class="badge rounded-pill bg-danger" th:text="${session.cart != null ? session.cart.size() : 0}">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row bg-white p-5 rounded shadow mx-0">
        <div class="col-md-6 mb-4 mb-md-0">
            <img th:src="${product.imageUrl}" class="img-fluid rounded shadow-sm" alt="producto" style="width: 100%; height: 400px; object-fit: cover;">
        </div>
        <div class="col-md-6 ps-md-5">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/productos" class="text-decoration-none">Catálogo</a></li>
                    <li class="breadcrumb-item active" th:text="${product.category}">Categoría</li>
                </ol>
            </nav>
            <h1 class="display-5 fw-bold mb-3" th:text="${product.name}">Nombre</h1>
            <span class="badge badge-category fs-6 px-3 py-2 mb-4" th:text="${product.category}">Categoría</span>
            
            <h2 class="product-price mb-4 fs-1">S/ <span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></h2>
            <p class="text-muted fs-5 mb-5" th:text="${product.description}">Descripción detallada...</p>
            
            <div class="card bg-light border-0 mb-5">
                <div class="card-body">
                    <p class="m-0"><strong>Estado:</strong> 
                        <span th:if="${product.stock > 0}" class="text-success fw-bold">✓ En Stock (<span th:text="${product.stock}"></span> disponibles)</span>
                        <span th:if="${product.stock <= 0}" class="text-danger fw-bold">✗ Agotado</span>
                    </p>
                </div>
            </div>

            <div class="d-grid gap-3 d-md-flex">
                <form th:action="@{/carrito/agregar}" method="post" class="flex-grow-1">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <button class="btn btn-primary btn-lg w-100 py-3" type="submit" th:disabled="${product.stock <= 0}">
                        🛒 Añadir al Carrito
                    </button>
                </form>
                <a href="/productos" class="btn btn-outline-secondary btn-lg px-5 py-3">Volver</a>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light py-4 border-top mt-5">
    <div class="container text-center">
        <p class="text-muted">&copy; 2026 Kiwisha E-Commerce.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
