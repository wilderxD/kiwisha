<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="/productos">Catálogo</a></li>
            </ul>
            <ul class="navbar-nav">
                <li th:if="${session.user == null}" class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li th:if="${session.user != null}" class="nav-item"><span class="nav-link text-white" th:text="${'Hola, ' + session.user}"></span></li>
                <li th:if="${session.user != null}" class="nav-item"><a class="nav-link text-warning" href="/logout">Salir</a></li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light ms-lg-3 px-3 rounded-pill" href="/carrito">
                        🛒 <span class="badge rounded-pill bg-danger" th:text="${session.cart != null ? session.cart.size() : 0}">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold m-0 border-start border-4 border-primary ps-3">Explora nuestra Kiwicha</h2>
        <span class="text-muted" th:text="${products.size() + ' productos encontrados'}">0 productos</span>
    </div>

    <div th:if="${param.added}" class="alert alert-success alert-dismissible fade show" role="alert">
        ¡Producto añadido al carrito correctamente!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- US-03 & US-04: Búsqueda y Filtros -->
    <div class="row mb-5 bg-white p-4 rounded shadow-sm mx-0">
        <div class="col-md-7">
            <form th:action="@{/productos}" method="get" class="d-flex">
                <input type="text" name="q" class="form-control form-control-lg me-2 border-0 bg-light" placeholder="¿Qué buscas hoy?" th:value="${query}">
                <button class="btn btn-primary px-4" type="submit">🔍</button>
            </form>
        </div>
        <div class="col-md-5">
            <div class="d-flex justify-content-md-end mt-3 mt-md-0 gap-2">
                <a href="/productos?categoria=Granos" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Granos</a>
                <a href="/productos?categoria=Harinas" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Harinas</a>
                <a href="/productos?categoria=Snacks" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Snacks</a>
                <a th:if="${category != null or query != null}" href="/productos" class="btn btn-link btn-sm text-danger">Limpiar</a>
            </div>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${products}">
            <div class="card h-100 border-0">
                <div class="position-relative">
                    <img th:src="${p.imageUrl}" class="card-img-top" alt="producto" style="height: 200px; object-fit: cover;">
                    <span class="position-absolute top-0 end-0 m-3 badge badge-category" th:text="${p.category}">Cat</span>
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${p.name}">Producto</h5>
                    <p class="card-text text-muted small" th:text="${p.description}">Descripción...</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="product-price">S/ <span th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</span></span>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <div class="d-grid gap-2">
                        <form th:action="@{/carrito/agregar}" method="post">
                            <input type="hidden" name="productId" th:value="${p.id}">
                            <button type="submit" class="btn btn-outline-primary w-100 mb-2">Añadir al Carrito</button>
                        </form>
                        <a th:href="@{/productos/{id}(id=${p.id})}" class="btn btn-link btn-sm text-muted text-decoration-none">Ver más detalles →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light py-4 border-top mt-5">
    <div class="container text-center">
        <p class="text-muted">&copy; 2026 Kiwisha E-Commerce.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
