<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Historial de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="/wishlist">Wishlist ❤️</a></li>
                <li class="nav-item"><a class="nav-link active" href="/orders/history">Mis Pedidos 📦</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-4">Tu Historial de Pedidos 📦</h2>
                    
                    <div th:if="${orders.empty}" class="text-center py-5">
                        <p class="text-muted">Aún no has realizado ningún pedido.</p>
                        <a href="/productos" class="btn btn-primary rounded-pill">Ir a comprar</a>
                    </div>

                    <div th:if="${!orders.empty}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Estado / Notificación (US10)</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${'order-' + order.id}">1</td>
                                    <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${order.status == 'COMPLETADO' ? 'bg-success' : (order.status == 'CANCELADO' ? 'bg-danger' : 'bg-info')}" 
                                              th:text="${order.status}">Estado</span>
                                    </td>
                                    <td th:text="${'S/ ' + order.total}">S/ 0.00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-muted">
    <p>&copy; 2026 Kiwisha E-Commerce.</p>
</footer>

</body>
</html>
