<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Validación de Cupones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Kiwisha</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/productos">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="/wishlist">Wishlist ❤️</a></li>
                <li class="nav-item"><a class="nav-link" href="/pedidos/historial/Juan">Pedidos 📦</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            <div class="card shadow border-0 p-5">
                <div class="mb-4">
                    <h1 class="display-5">🎟️</h1>
                    <h2>Validador de Cupones</h2>
                </div>
                
                <div th:if="${valid}" class="alert alert-success border-0 shadow-sm">
                    <h4 class="alert-heading">¡Cupón Válido!</h4>
                    <p class="mb-0">Has obtenido un descuento del <strong th:text="${discount + '%'}">15%</strong>.</p>
                </div>

                <div th:if="${valid == false}" class="alert alert-danger border-0 shadow-sm">
                    <h4 class="alert-heading">Cupón Inválido</h4>
                    <p class="mb-0">El código ingresado no existe o ha expirado.</p>
                </div>

                <div class="mt-4">
                    <p class="text-muted">Código ingresado: <code th:text="${code}">CODIGO</code></p>
                    <a href="/productos" class="btn btn-primary px-4 rounded-pill">Volver al Catálogo</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
