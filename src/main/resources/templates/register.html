<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kiwisha - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <h2 class="text-center mb-4">Unirse a Kiwisha</h2>
                
                <form th:action="@{/registro}" method="post">
                    <div th:if="${error}" class="alert alert-danger mb-3 border-0 small" th:text="${error}"></div>
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" name="username" required placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" name="email" required placeholder="ejemplo@kiwisha.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill">Crear Cuenta</button>
                </form>
                
                <hr>
                <p class="text-center mb-0">¿Ya tienes cuenta? <a href="/login">Ingresa aquí</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
